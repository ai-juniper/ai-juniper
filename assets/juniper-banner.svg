<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Juniper, AI Assistant">
  <defs>
    <radialGradient id="fundo" cx="22%" cy="50%" r="85%">
      <stop offset="0" stop-color="#2a1b5e"/>
      <stop offset="0.55" stop-color="#120d2b"/>
      <stop offset="1" stop-color="#07060f"/>
    </radialGradient>
    <linearGradient id="face-clara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd3ff"/>
    </linearGradient>
    <linearGradient id="face-esq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="face-dir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .halo { animation: pulsar 4s ease-in-out infinite; transform-origin: 240px 160px; }
      .cristal { animation: flutuar 6s ease-in-out infinite; }
      .estrela { animation: piscar 3s ease-in-out infinite; }
      .estrela:nth-of-type(2n) { animation-delay: 1.2s; }
      .estrela:nth-of-type(3n) { animation-delay: 2.1s; }
      @keyframes pulsar { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: .8; transform: scale(1.08); } }
      @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes piscar { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .halo, .cristal, .estrela { animation: none; } }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#fundo)"/>

  <g fill="#c4b5fd">
    <circle class="estrela" cx="520" cy="52" r="1.6"/>
    <circle class="estrela" cx="690" cy="34" r="1.2"/>
    <circle class="estrela" cx="880" cy="70" r="1.8"/>
    <circle class="estrela" cx="1050" cy="44" r="1.3"/>
    <circle class="estrela" cx="1130" cy="120" r="1.6"/>
    <circle class="estrela" cx="980" cy="270" r="1.4"/>
    <circle class="estrela" cx="760" cy="288" r="1.2"/>
    <circle class="estrela" cx="80" cy="60" r="1.4"/>
    <circle class="estrela" cx="120" cy="270" r="1.7"/>
    <circle class="estrela" cx="380" cy="286" r="1.2"/>
  </g>

  <circle class="halo" cx="240" cy="160" r="92" fill="#8b5cf6" filter="url(#brilho)"/>

  <g class="cristal">
    <polygon points="240,40 205,128 240,128" fill="url(#face-clara)"/>
    <polygon points="240,40 275,128 240,128" fill="#e9e3ff"/>
    <polygon points="205,128 240,280 240,128" fill="url(#face-esq)"/>
    <polygon points="275,128 240,280 240,128" fill="url(#face-dir)"/>
  </g>

  <text x="420" y="138" font-size="76" font-weight="700" fill="#f4f1ff" letter-spacing="2">Juniper</text>
  <text x="424" y="178" font-size="22" fill="#c4b5fd" letter-spacing="7">AI ASSISTANT</text>
  <rect x="424" y="196" width="560" height="2" fill="url(#linha)"/>

  <text x="424" y="234" font-size="21" fill="#e9e3ff" letter-spacing="0.5">Ouço<tspan fill="#8b5cf6" font-weight="700" dx="10" dy="0">·</tspan><tspan dx="10">penso</tspan><tspan fill="#8b5cf6" font-weight="700" dx="10">·</tspan><tspan dx="10">programo</tspan></text>

  <g font-size="14" font-weight="600" letter-spacing="1" text-anchor="middle">
    <g transform="translate(424 254)">
      <rect width="104" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="52" y="20" fill="#a7f3d0">ANDROID</text>
    </g>
    <g transform="translate(540 254)">
      <rect width="108" height="30" rx="15" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="54" y="20" fill="#bfdbfe">WINDOWS</text>
    </g>
    <g transform="translate(660 254)">
      <rect width="72" height="30" rx="15" fill="#f0abfc" fill-opacity="0.12" stroke="#f0abfc" stroke-opacity="0.5"/>
      <text x="36" y="20" fill="#f5d0fe">WEB</text>
    </g>
    <g transform="translate(744 254)">
      <rect width="128" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="64" y="20" fill="#ddd6fe">SERVIDORES</text>
    </g>
  </g>
</svg>
